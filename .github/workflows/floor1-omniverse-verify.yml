name: Floor-1 Omegaverse verification

on:
  pull_request:
    paths:
      - ".github/workflows/floor1-omniverse-verify.yml"
      - ".gitattributes"
      - "AGENTS.md"
      - "docs/ASOLARIA-FLOOR1-OMEGAVERSE-TRILATERAL-PREPARATION-2026-07-15.md"
      - "trilateral/omniverse_pid_particles_v1/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floor1-omniverse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out exact PR bytes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run semantic model regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest -v trilateral.omniverse_pid_particles_v1.test_model

      - name: Verify sealed HBP/HBI/hex/SHA packet
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m trilateral.omniverse_pid_particles_v1.prepare verify
          --output trilateral/omniverse_pid_particles_v1/artifacts

      - name: Reject line-ending and whitespace drift
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path

          roots = [
              Path("AGENTS.md"),
              Path(".gitattributes"),
              Path("docs/ASOLARIA-FLOOR1-OMEGAVERSE-TRILATERAL-PREPARATION-2026-07-15.md"),
          ]
          roots.extend(Path("trilateral/omniverse_pid_particles_v1").rglob("*"))
          checked = 0
          for path in roots:
              if not path.is_file() or path.suffix not in {".py", ".md", ".hbp", ".hbi", ".hex", ".sha256", ""}:
                  continue
              body = path.read_bytes()
              if b"\r" in body:
                  raise SystemExit(f"CR byte rejected: {path}")
              checked += 1
          print(f"LF_ONLY_PASS files={checked}")
          PY
